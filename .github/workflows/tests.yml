name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .[images]
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q stock_metadata app.py models.py exporters.py
      - run: python tools/package_skill.py
      - uses: actions/upload-artifact@v4
        with:
          name: skill-${{ matrix.os }}-${{ matrix.python }}
          path: dist/stock-metadata-assistant*
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -e .[images,ui]
      - run: python -m unittest discover -s tests -v
